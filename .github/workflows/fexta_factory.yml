name: FEXTA Detail Factory

on:
workflow_dispatch:
inputs:
product_url:
description: "fexta.co.kr 상품 상세 URL"
required: true
type: string
material_override:
description: "재질 / 원단 선택"
required: false
default: "자동 판별"
type: choice
options:
- "자동 판별"
- "마닐라지"
- "합지"
- "크라프트지"
- "수입지"
cutout_bg:
description: "AI 누끼 배경 마감"
required: false
default: "studio"
type: choice
options:
- "studio"
- "white"
- "transparent"
output_size:
description: "출력 해상도 (px)"
required: false
default: "1200"
type: choice
options:
- "1200"
- "1600"
detail_cutout_mode:
description: "상세 컷 AI 누끼 처리 여부"
required: false
default: "단독 제품컷 AI 누끼 변환"
type: choice
options:
- "단독 제품컷 AI 누끼 변환"
- "원본 고화질 유지"

jobs:
build_fexta_detail:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Setup Python 3.11
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Cache AI model
    uses: actions/cache@v4
    with:
      path: ~/.u2net
      key: rembg-isnet-model-v1

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install requests beautifulsoup4 lxml pillow numpy scipy "rembg[cpu]" onnxruntime google-genai

  - name: Run FEXTA detail builder
    env:
      PRODUCT_URL: ${{ inputs.product_url }}
      MATERIAL_OVERRIDE: ${{ inputs.material_override }}
      CUTOUT_BG: ${{ inputs.cutout_bg }}
      OUTPUT_SIZE: ${{ inputs.output_size }}
      DETAIL_CUTOUT_MODE: ${{ inputs.detail_cutout_mode }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    run: python build_detail.py

  - name: Upload output ZIP artifact
    uses: actions/upload-artifact@v4
    with:
      name: fexta-detail-run-${{ github.run_number }}
      path: output/
      retention-days: 30
